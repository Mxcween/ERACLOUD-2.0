# Головний конфіг. Все, що варто крутити руками, зібрано тут.

markets:
  - code: PL
    host: www.vinted.pl
    currency: PLN
    locale: pl-PL,pl;q=0.9,en;q=0.8
    enabled: true
    # ЕФЕКТИВНА доставка на ОДНУ річ. Vinted бере доставку за замовлення,
    # тому якщо береш у продавця три речі за раз, дели вартість доставки
    # на три. Це найважливіше число в усьому конфігу: воно вирішує, чи
    # проходять дешеві категорії взагалі.
    shipping_eur: 3.5

  - code: DE
    host: www.vinted.de
    currency: EUR
    locale: de-DE,de;q=0.9,en;q=0.8
    enabled: true
    # Те саме: ефективна доставка на одну річ, а не за посилку.
    shipping_eur: 4.5

polling:
  # Скільки секунд між повними обходами всіх стрічок.
  # Обхід і так не встигає прочитати все, що дозволяє квота, тому довга
  # пауза зверху лише додавала простою. Обмежувач сам розтягне цикл рівно
  # настільки, наскільки Vinted дозволить читати.
  cycle_seconds: 60
  # Мінімальна пауза між будь-якими двома запитами до Vinted. Тримає нас
  # у безпечній зоні на одному IP. 10 запитів за 4с проходили без блокувань,
  # тут навмисне вдвічі повільніше.
  min_request_interval: 2.0
  # Стеля на ВЕСЬ процес. Vinted рахує запити по IP, тому окремі лічильники
  # на vinted.pl і vinted.de вдвічі занижували те, що бачить Vinted: конфіг
  # казав "запит на дві секунди", а з того боку виходив запит на секунду.
  # Звідси й 429 з першої хвилини, ще до першої стрічки.
  # Історія цього числа: 5.0 було гірше за 3.5 (63% відмов проти 34%), що й
  # підказало - впираємось не в частоту. Тепер, коли штраф не заганяє себе в
  # стелю, цикл виходить 104с при заданих 60, тобто гальмує вже ця пауза, а
  # не Vinted: штраф тримається 1.0-1.2, значить запас є. Якщо в /health
  # почнуть з'являтись 403 замість 429 - вертай 3.5.
  ip_request_interval: 2.5
  # Скільки категорій обходимо за цикл, по колу. 0 - усі.
  #
  # Тут стояло 4, і це виявилось помилкою. Логіка була "не проси більше, ніж
  # дають". Заміри сказали інше: успішних читань виходить ~2 на хвилину і
  # при 22 запитах на цикл, і при 8 - квота однакова, скільки не проси.
  # Різниця лише в тому, ПО ЧОМУ ці читання розподіляються: при чотирьох
  # категоріях решта сім не бачаться взагалі до наступного оберту, при всіх
  # одинадцяти кожна має шанс щоцикла. Та сама кількість прочитаного, але
  # розмазана по всій стрічці, а не по її чверті.
  #
  # Ціна: більше 429 у логах. Вони нічого не коштують у пропускній здатності
  # (доведено вимірюванням), але тримати половину відмов постійно - певний
  # ризик, що Vinted перейде від 429 до жорсткого блоку. Якщо в /health
  # почнуть з'являтись 403 замість 429 - вертай сюди 4.
  categories_per_cycle: 0
  items_per_page: 96
  # Запобіжник проти залпу після простою. Застосовується ТІЛЬКИ коли між
  # циклами був розрив (старт, падіння, сон безкоштовного інстанса Render):
  # тоді вся стрічка виглядає новою і без цього бот вивалив би добу історії.
  # У звичайній роботі вік не перевіряється взагалі, бо Vinted віддає
  # таймстемп ФОТО, а він старший за публікацію в перевиставлених речей.
  max_item_age_seconds: 3600
  # Перші цикли тільки наповнюють базу цін і нічого не шлють. Три цикли це
  # 0 = не притримуємо нічого, шлемо з першого ж циклу.
  #
  # Дійшло до нуля в два кроки. Спершу 3 -> 1, коли лічильники показали, що
  # прогрів викидає 17 знахідок із 23. Потім 1 -> 0, коли той самий єдиний
  # цикл з'їв 11 із 27: на першому циклі вся стрічка нова, тому саме він
  # найврожайніший, і притримувати треба саме його.
  #
  # Було 3, і це виявилось найдорожчою настройкою в конфізі. На першому
  # циклі вся стрічка нова, тому знахідок там у рази більше, ніж потім:
  # заміряно 17 угод із 23 за 23 хвилини роботи. Усі три цикли прогріву їх
  # викидали. А оскільки DATABASE_URL порожній і база стирається з кожним
  # деплоєм, прогрів починався заново після КОЖНОГО оновлення - тобто бот
  # регулярно викидав саме той врожай, заради якого й запускався.
  #
  # Одного циклу досить, бо від холодної бази цін нас насправді захищає
  # інше: min_samples_for_median вимагає 8 живих оголошень, перш ніж вірити
  # медіані, а без неї оцінка йде з базової таблиці ще й зі штрафом
  # unmeasured_multiple_premium. Прогрів був другим, грубішим замком на тих
  # самих дверях.
  warmup_cycles: 0
  # Глибокий прохід по дешевому хвосту: кожні N циклів бот проходить ті самі
  # категорії, але з сортуванням за ціною, а не за свіжістю. Так у поле зору
  # потрапляють лоти, які висять годинами: зі стрічки новинок вони випали,
  # а з дешевого хвоста нікуди не дінуться.
  # Кожні N циклів. Було 20 (раз на 25 хвилин) - надто рідко для того, щоб
  # дешевий хвіст узагалі впливав на потік.
  deep_scan_every_cycles: 6
  # Одна сторінка, не дві. Глибокий прохід іде по ВСІХ категоріях і обох
  # ринках, тому кожна сторінка коштує 22 запити: при двох це залп у 44
  # штуки поверх звичайних 22. Виміряна квота Vinted для нас - близько
  # чотирьох успішних читань на хвилину, тож такий залп сам собі забивав
  # канал і надовго заганяв штраф у стелю.
  deep_scan_pages: 1
  request_timeout: 20.0
  max_retries: 3

scoring:
  # ГОЛОВНЕ ПРАВИЛО. multiple = скільки разів відіб'ються вкладені гроші.
  # 2.0 означає "продам мінімум удвічі дорожче", тобто профіт x1.
  min_multiple: 1.7
  # Планка залежить від тіру бренду. Причина проста: x2 на куртці Stone Island
  # це 90 євро, а x2 на кросівках Kappa це 12. Щоб масовий бренд потрапив у
  # стрічку, він має бути справжньою крадіжкою, а не просто дешевим.
  # Планки опущені назад заради обсягу. Заміряно: на високих планках
  # (2.0/2.2/2.8) знаходилось 90 угод за 173 хвилини - 31 на годину. Це
  # СТЕЛЯ алертів при таких планках, хай фільтр пропускає хоч усе, тож
  # частіше ніж раз на дві хвилини не вийшло б у принципі. Мотлох тепер
  # тримає підлога профіту в fat.floor_eur, а не висока планка множника.
  min_multiple_by_tier:
    S: 1.7
    A: 1.9
    B: 2.3
  top_multiple: 3.0
  # ДРУГИЙ ШЛЯХ ПРОХОДЖЕННЯ: великі гроші самі по собі.
  # Планка множника вище відсікає дрібницю, але заразом ріже й протилежне -
  # дорогу річ із солідним профітом, у якої множник "лише" x1.8. Куртка за
  # 55 євро з продажем за 130 це +75 у кишеню, і викидати її через те, що
  # x2.36 не дотягнув до x2.8 для масового бренду, - втрачені гроші.
  # Тому лот проходить, якщо АБО множник по тіру, АБО профіт від цієї суми.
  profit_override_eur: 30.0
  # Але навіть на цьому шляху множник має лишатись пристойним: x1.2 це вже
  # не знахідка, а звичайна перепродажа з мінімальним запасом на торг.
  override_min_multiple: 1.45
  # Так само для ТОП-каналу: дуже великі гроші потрапляють туди навіть без
  # рекордного множника.
  top_profit_override_eur: 70.0
  # Стеля "занадто добре, щоб бути правдою". Множник вище цього майже завжди
  # означає приманку: продавець ставить 1.75 євро за нові adidas, збирає
  # перегляди, потім міняє ціну або лот зносять. Приклад з практики: один
  # продавець виставив пʼять однакових пар у розмірах 41-44 за 1.75, усі
  # видалені протягом години.
  max_multiple: 10.0
  # Запасний поріг профіту, якщо категорія не задала свій. Реальні пороги
  # живуть у categories.yaml, бо вони мусять залежати від категорії:
  # 12 євро з куртки це нормально, а з футболки недосяжно.
  min_profit_eur: 8.0
  top_profit_eur: 35.0
  # Медіана оголошень завжди вища за реальну ціну продажу: на Vinted торгуються,
  # шлють офери, скидають ціну через тиждень висіння. 0.72 означає "продам за
  # 72% від того, що просять інші". Це навмисне песимістично: краще пропустити
  # сумнівний лот, ніж купити неліквід.
  # Лот із дешевого хвоста ринок уже бачив і не взяв, тож невідома причина
  # закладена в ціну. Тому з нього вимагаємо помітно більше, ніж зі свіжака:
  # свіжий лот - це інформаційна перевага, залежалий - це ризик.
  # Пороги для залежалих лотів. Були 25€ і x3.0 - настільки вище звичайних,
  # що глибокий прохід майже нічого не пропускав і ходив дарма. Надбавка за
  # невідомість потрібна, але вдвічі-втричі суворіше за свіжак це вже не
  # надбавка, а заборона.
  deep_min_profit_eur: 14.0
  deep_min_multiple: 2.1
  # Скільки залежалих знахідок пускаємо за один глибокий прохід (найжирніші)
  deep_max_alerts: 6

  # ЖИР. Пороги вище відповідають на питання "чи вигідно", і вигідного на
  # Vinted багато. Це відповідає на інше: "чи це краще за те, що трапляється
  # зазвичай". Планка не задана числом, а рахується з самого потоку - беремо
  # профіт останніх знахідок і пускаємо лише верхній хвіст. Тому вона сама
  # піднімається в багатий день і опускається в бідний.
  fat:
    # 0 = перцентиль вимкнено, працює сама підлога floor_eur.
    #
    # ЦЕ ГОЛОВНА РУЧКА, якщо колись знову захочеться рідше і жирніше:
    # постав 60 - планка сяде десь на 29€ і зріже дві третини потоку;
    # 75 - близько 49€. Обидва значення заміряні на живому боті. Зараз
    # вимкнено, бо потрібен максимальний обсяг, а не відбір.
    percentile: 0
    # На скількох останніх знахідках рахуємо планку
    window: 200
    # Абсолютна підлога профіту - тепер єдиний фільтр жиру. Тримає внизу
    # те, заради чого не варто їхати: 10€ це приблизно вартість доставки
    # плюс трохи. Підняти до 20 - потік помітно вужчий, але кожен алерт
    # вагоміший (заміряно: 20€ відсікало худі з профітом 9€ і Polo з 15€).
    floor_eur: 10
    # Поки знахідок менше, працює сама підлога: рахувати перцентиль по
    # трьох числах означає видавати випадковість за статистику. При цих
    # планках знахідок близько однієї на цикл, тож 30 зразків це приблизно
    # півтори години роботи, і весь цей час фільтрує сама підлога.
    warmup_samples: 30
    # Скільки алертів за цикл максимум, найжирніші першими. Поставлено
    # завідомо високо, щоб черга нічого не відсіювала сама: відбирати має
    # підлога профіту, а не те, що не влізло. При 20 і циклі 78с це до 15
    # алертів на хвилину - більше, ніж узагалі знаходиться.
    # Заміряно зі 133 брендами: цей ліміт викинув 25 угод із 58 за пʼять
    # циклів - тобто відсівав не слабке, а те, що не влізло. Джерело тепер
    # дає ~12 угод на хвилину, цикл 75с, отже ~15 за цикл; 60 це запас.
    max_per_cycle: 60

  resale_haircut: 0.72
  # Комісія при перепродажі. На Vinted платить покупець, тому 0.
  # Якщо продаєш через майданчик з комісією, постав свою частку.
  resale_fee_rate: 0.0
  # Наскільки суворіші вимоги, коли ціна перепродажу ще не виміряна, а взята
  # з базової таблиці. Додається до min_multiple.
  unmeasured_multiple_premium: 0.4
  # Скільки живих оголошень треба, щоб довіряти медіані замість базової ціни
  min_samples_for_median: 8
  # Скільки останніх спостережень тримаємо на кожну зв'язку бренд+категорія+стан
  price_window_size: 120
  # Спостереження старші за це не враховуються в медіані і чистяться з бази.
  # Кожен лот рахується один раз, тому це приблизно 100 тисяч рядків на добу.
  price_window_days: 14

seller:
  # Продавці-магазини часто перепродають самі і ставлять ціну по ринку.
  # true - повністю ігнорувати їх, false - слати, але з позначкою в алерті.
  skip_business_sellers: false
  # Кількість відгуків продавця Vinted у стрічці каталогу не віддає, тому
  # фільтра по рейтингу тут немає. Дивись профіль продавця перед покупкою.

discord:
  # Межі цінових каналів за СОБІВАРТІСТЮ лота (EUR), за зростанням. N меж
  # дають N+1 канал: [15, 45] означає канали "0-15", "15-45", "45+".
  # Кожному каналу відповідає свій вебхук у змінних оточення
  # DISCORD_WEBHOOK_0, DISCORD_WEBHOOK_1, ... Якщо вебхук порожній, цей
  # канал просто мовчить. Discord працює паралельно з Telegram, не замість.
  price_tier_bounds: [15, 45]

alerts:
  language: uk
  # Скільки алертів приймаємо від одного продавця за годину. Приманки йдуть
  # пачками з одного акаунта, і без цього стрічка забивається ними.
  max_alerts_per_seller_per_hour: 3
  # Тихі години у твоєму часовому поясі. Порожній список = шлемо цілодобово.
  # Приклад: [[1, 8]] заглушить з 01:00 до 08:00
  quiet_hours: []
  timezone: Europe/Kyiv
  # Стеля алертів на годину, щоб бот не заспамив канал при збої
  # 900 = 15 на хвилину в середньому. Це свідомо вище того, що дає джерело
  # (~740/год), щоб годинна стеля не різала мовчки: коли вона спрацьовує,
  # це видно лише в /health, а лот уже втрачено.
  max_alerts_per_hour: 900
  # Стеля на хвилину. Головне від залпу: лот понад ліміт не викидається,
  # а стає в чергу і йде наступним циклом, тож знахідки приходять
  # струмком, а не стосом, у якому найкраще губиться серед посереднього.
  # Стеля піднімалась двічі за виміряними даними: 12 -> 20, коли в чергу
  # пішло 6 знахідок за 25 хвилин, і 20 -> 60 зі 133 брендами. Власник
  # просив алерт раз на пʼять секунд, тобто 12 на хвилину; 60 лишає запас
  # на нерівність потоку, не перетворюючись на стелю знову.
  max_alerts_per_minute: 60
  # Скільки відкладених знахідок досилаємо за один раз після /start
  flush_batch: 5
  # Знахідка, яка пролежала в черзі довше, ніж це, уже нікому не потрібна:
  # її або купили, або на неї ніхто не претендує. Не шлемо.
  pending_stale_seconds: 1800
  send_photo: true

fx:
  # Курси оновлюються раз на добу з frankfurter.app, це безкоштовно і без ключа.
  # Значення нижче використовуються як резерв, якщо сервіс недоступний.
  base: EUR
  refresh_hours: 12
  fallback_rates:
    EUR: 1.0
    PLN: 4.30
    CZK: 25.0
    GBP: 0.84
    SEK: 11.3
    DKK: 7.46
    HUF: 395.0
    RON: 4.98
