# Головний конфіг. Все, що варто крутити руками, зібрано тут.

markets:
  - code: PL
    host: www.vinted.pl
    currency: PLN
    locale: pl-PL,pl;q=0.9,en;q=0.8
    enabled: true
    # ЕФЕКТИВНА доставка на ОДНУ річ. Vinted бере доставку за замовлення,
    # тому якщо береш у продавця три речі за раз, дели вартість доставки
    # на три. Це найважливіше число в усьому конфігу: воно вирішує, чи
    # проходять дешеві категорії взагалі.
    shipping_eur: 3.5

  - code: DE
    host: www.vinted.de
    currency: EUR
    locale: de-DE,de;q=0.9,en;q=0.8
    enabled: true
    # Те саме: ефективна доставка на одну річ, а не за посилку.
    shipping_eur: 4.5

polling:
  # Скільки секунд між повними обходами всіх стрічок
  cycle_seconds: 45
  # Мінімальна пауза між будь-якими двома запитами до Vinted. Тримає нас
  # у безпечній зоні на одному IP. 10 запитів за 4с проходили без блокувань,
  # тут навмисне вдвічі повільніше.
  min_request_interval: 0.8
  items_per_page: 96
  # Запобіжник проти залпу після простою. Застосовується ТІЛЬКИ коли між
  # циклами був розрив (старт, падіння, сон безкоштовного інстанса Render):
  # тоді вся стрічка виглядає новою і без цього бот вивалив би добу історії.
  # У звичайній роботі вік не перевіряється взагалі, бо Vinted віддає
  # таймстемп ФОТО, а він старший за публікацію в перевиставлених речей.
  max_item_age_seconds: 3600
  # Перші цикли тільки наповнюють базу цін і нічого не шлють. Три цикли це
  # приблизно дві хвилини і близько 4 тисяч спостережень.
  warmup_cycles: 3
  request_timeout: 20.0
  max_retries: 3

scoring:
  # ГОЛОВНЕ ПРАВИЛО. multiple = скільки разів відіб'ються вкладені гроші.
  # 2.0 означає "продам мінімум удвічі дорожче", тобто профіт x1.
  min_multiple: 2.0
  # Планка залежить від тіру бренду. Причина проста: x2 на куртці Stone Island
  # це 90 євро, а x2 на кросівках Kappa це 12. Щоб масовий бренд потрапив у
  # стрічку, він має бути справжньою крадіжкою, а не просто дешевим.
  min_multiple_by_tier:
    S: 2.0
    A: 2.2
    B: 2.8
  top_multiple: 3.0
  # ДРУГИЙ ШЛЯХ ПРОХОДЖЕННЯ: великі гроші самі по собі.
  # Планка множника вище відсікає дрібницю, але заразом ріже й протилежне -
  # дорогу річ із солідним профітом, у якої множник "лише" x1.8. Куртка за
  # 55 євро з продажем за 130 це +75 у кишеню, і викидати її через те, що
  # x2.36 не дотягнув до x2.8 для масового бренду, - втрачені гроші.
  # Тому лот проходить, якщо АБО множник по тіру, АБО профіт від цієї суми.
  profit_override_eur: 40.0
  # Але навіть на цьому шляху множник має лишатись пристойним: x1.2 це вже
  # не знахідка, а звичайна перепродажа з мінімальним запасом на торг.
  override_min_multiple: 1.6
  # Так само для ТОП-каналу: дуже великі гроші потрапляють туди навіть без
  # рекордного множника.
  top_profit_override_eur: 70.0
  # Стеля "занадто добре, щоб бути правдою". Множник вище цього майже завжди
  # означає приманку: продавець ставить 1.75 євро за нові adidas, збирає
  # перегляди, потім міняє ціну або лот зносять. Приклад з практики: один
  # продавець виставив пʼять однакових пар у розмірах 41-44 за 1.75, усі
  # видалені протягом години.
  max_multiple: 10.0
  # Запасний поріг профіту, якщо категорія не задала свій. Реальні пороги
  # живуть у categories.yaml, бо вони мусять залежати від категорії:
  # 12 євро з куртки це нормально, а з футболки недосяжно.
  min_profit_eur: 8.0
  top_profit_eur: 35.0
  # Медіана оголошень завжди вища за реальну ціну продажу: на Vinted торгуються,
  # шлють офери, скидають ціну через тиждень висіння. 0.72 означає "продам за
  # 72% від того, що просять інші". Це навмисне песимістично: краще пропустити
  # сумнівний лот, ніж купити неліквід.
  resale_haircut: 0.72
  # Комісія при перепродажі. На Vinted платить покупець, тому 0.
  # Якщо продаєш через майданчик з комісією, постав свою частку.
  resale_fee_rate: 0.0
  # Наскільки суворіші вимоги, коли ціна перепродажу ще не виміряна, а взята
  # з базової таблиці. Додається до min_multiple.
  unmeasured_multiple_premium: 0.4
  # Скільки живих оголошень треба, щоб довіряти медіані замість базової ціни
  min_samples_for_median: 8
  # Скільки останніх спостережень тримаємо на кожну зв'язку бренд+категорія+стан
  price_window_size: 120
  # Спостереження старші за це не враховуються в медіані і чистяться з бази.
  # Кожен лот рахується один раз, тому це приблизно 100 тисяч рядків на добу.
  price_window_days: 14

seller:
  # Продавці-магазини часто перепродають самі і ставлять ціну по ринку.
  # true - повністю ігнорувати їх, false - слати, але з позначкою в алерті.
  skip_business_sellers: false
  # Кількість відгуків продавця Vinted у стрічці каталогу не віддає, тому
  # фільтра по рейтингу тут немає. Дивись профіль продавця перед покупкою.

discord:
  # Межі цінових каналів за СОБІВАРТІСТЮ лота (EUR), за зростанням. N меж
  # дають N+1 канал: [15, 45] означає канали "0-15", "15-45", "45+".
  # Кожному каналу відповідає свій вебхук у змінних оточення
  # DISCORD_WEBHOOK_0, DISCORD_WEBHOOK_1, ... Якщо вебхук порожній, цей
  # канал просто мовчить. Discord працює паралельно з Telegram, не замість.
  price_tier_bounds: [15, 45]

alerts:
  language: uk
  # Скільки алертів приймаємо від одного продавця за годину. Приманки йдуть
  # пачками з одного акаунта, і без цього стрічка забивається ними.
  max_alerts_per_seller_per_hour: 2
  # Тихі години у твоєму часовому поясі. Порожній список = шлемо цілодобово.
  # Приклад: [[1, 8]] заглушить з 01:00 до 08:00
  quiet_hours: []
  timezone: Europe/Kyiv
  # Стеля алертів на годину, щоб бот не заспамив канал при збої
  max_alerts_per_hour: 60
  send_photo: true

fx:
  # Курси оновлюються раз на добу з frankfurter.app, це безкоштовно і без ключа.
  # Значення нижче використовуються як резерв, якщо сервіс недоступний.
  base: EUR
  refresh_hours: 12
  fallback_rates:
    EUR: 1.0
    PLN: 4.30
    CZK: 25.0
    GBP: 0.84
    SEK: 11.3
    DKK: 7.46
    HUF: 395.0
    RON: 4.98
