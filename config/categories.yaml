# Категорії Vinted. Опитуються ТОЧНІ підкатегорії, а не батьківські.
#
# Це принципово. Батьківська категорія взуття тягнула сандалі й шльопанці,
# батьківський спортивний одяг тягнув шорти та спортивні аксесуари. Кожен раз
# доводилось вгадувати сміття за назвою і кожен раз знаходилась мова, якої в
# списку немає. Точні підкатегорії прибирають цілі класи сміття структурно.
#
# ceiling_eur     - максимальна ціна купівлі, запобіжник від "брендової" речі
#                   без запасу на перепродаж.
# baseline_eur    - медіана цін на vinted.de, виміряна по кожній підкатегорії
#                   окремо (по 192 лоти на категорію). Працює поки бот не
#                   назбирав власної статистики по конкретному бренду.
# min_profit_eur  - скільки чистими має лишитись. Свій для кожної категорії:
#                   12 євро з куртки нормально, з футболки недосяжно.

defaults:
  min_price_eur: 1.0

categories:
  # --- верх ---
  - id: 77
    key: tops_tshirts
    name: Футболки
    ceiling_eur: 16
    weight_kg: 0.3
    baseline_eur: {S: 40, A: 17, B: 8}
    min_profit_eur: 6

  - id: 5492
    key: polo
    name: Поло
    ceiling_eur: 20
    weight_kg: 0.35
    baseline_eur: {S: 55, A: 25, B: 12}
    min_profit_eur: 8

  - id: 79
    key: knitwear_hoodies
    name: Худі, светри, світшоти
    ceiling_eur: 32
    weight_kg: 0.7
    baseline_eur: {S: 70, A: 35, B: 15}
    min_profit_eur: 8

  # --- верхній одяг ---
  - id: 1206
    key: outerwear
    name: Куртки та верхній одяг
    ceiling_eur: 60
    weight_kg: 1.2
    baseline_eur: {S: 215, A: 70, B: 35}
    min_profit_eur: 12

  # --- низ ---
  - id: 257
    key: jeans
    name: Джинси
    ceiling_eur: 32
    weight_kg: 0.8
    baseline_eur: {S: 60, A: 30, B: 24}
    min_profit_eur: 8

  - id: 34
    key: trousers
    name: Штани
    ceiling_eur: 30
    weight_kg: 0.7
    baseline_eur: {S: 55, A: 30, B: 20}
    min_profit_eur: 8

  # --- спортивне: точні підкатегорії, БЕЗ шортів і аксесуарів ---
  - id: 582
    key: tracksuits
    name: Спортивні костюми
    ceiling_eur: 40
    weight_kg: 1.0
    baseline_eur: {S: 110, A: 60, B: 40}
    min_profit_eur: 12

  - id: 583
    key: track_pants
    name: Спортивні штани
    ceiling_eur: 26
    weight_kg: 0.6
    baseline_eur: {S: 55, A: 30, B: 20}
    min_profit_eur: 8

  - id: 581
    key: track_jackets
    name: Олімпійки та вітрівки
    ceiling_eur: 28
    weight_kg: 0.7
    baseline_eur: {S: 55, A: 30, B: 20}
    min_profit_eur: 8

  # --- взуття: лише кросівки ---
  - id: 1242
    key: shoes
    name: Кросівки
    ceiling_eur: 45
    weight_kg: 1.1
    baseline_eur: {S: 100, A: 55, B: 46}
    min_profit_eur: 15

  # Вимкнені навмисно. Аксесуари давали ремені, футляри та кепки; шорти й
  # спортивні аксесуари прибрані тим, що ми не опитуємо батьківську 30.
  - id: 82
    key: accessories
    name: Сумки та аксесуари
    enabled: false
    ceiling_eur: 30
    weight_kg: 0.5
    baseline_eur: {S: 45, A: 21, B: 13}
    min_profit_eur: 10

# Стани речі за версією Vinted. Id перевірені емпірично на vinted.pl:
#   6 = нове з биркою, 1 = нове без бирки, 2 = дуже добре,
#   3 = добре, 4 = задовільне, 7 = несправне
conditions:
  accepted_ids: [6, 1, 2, 3]

  # Стан можна звужувати для окремих категорій. Для взуття "добре" означає
  # затерту підошву і брудний верх: таке не перепродається, хоч бренд і
  # правильний. Для одягу "добре" цілком робочий стан.
  accepted_ids_by_category:
    shoes: [6, 1, 2]
  buckets:
    new: [6, 1]
    very_good: [2]
    good: [3]
  # Наскільки стан впливає на ціну перепродажу відносно "дуже доброго"
  resale_factor:
    new: 1.15
    very_good: 1.0
    good: 0.82

# Розміри. Порівняння нечутливе до регістру і пробілів. Для одягу дивимось
# на початок рядка розміру, бо Vinted пише "M / 38 / 10".
sizes:
  clothing: [S, M, L, XL]
  shoes_eu_min: 40
  shoes_eu_max: 46
  # Аксесуари здебільшого без розміру, тому їх не фільтруємо
  skip_size_check_categories: [accessories]

# Сміття, яке продають під брендовою назвою і в брендовій категорії.
# Нашивка CP Company лежить у "верхньому одязі", шнурки BAPE у "взутті", і
# бот оцінював би їх як куртку та кросівки відповідно. Стеля ціни тут не
# рятує: нашивка за 14 євро спокійно проходить під стелю куртки в 55.
#
# Слова шукаються цілими (не частинами інших слів), без урахування регістру
# та діакритики. Мови ті, що реально трапляються в польській і німецькій
# стрічках. Такі лоти відсікаються повністю.
