  - schnursenkel
  - lacci
  - veters
  - tkanicky
  # тапки, шльопанці, сандалі: дешеві, важко продати, забивають стрічку
  - klapki
  - claquette
  - claquettes
  - chanclas
  - teenslippers
  - kapcie
  - pantofle
  - papucs
  - slides
  - slide
  - adilette
  - adilettes
