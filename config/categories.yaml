# Слова, що натякають на репліку. НЕ відсікаємо, лише додаємо попередження
# в алерт: продавці часто пишуть їх у запереченні ("nie fake", "no replica",
# "oryginal nie podrobka"), і жорсткий фільтр викидав би нормальні лоти.
title_warn_words:
  - replika
  - replica
  - podrobka
  - podrobki
  - fake
  - inspired
  - "1:1"
  - aaa

# Кепки як тема мертві: дешеві, море підробок, ніхто не бере. Виняток лише
# для люксу, там кепка коштує як куртка. Слово в назві відсікає лот, якщо
# бренд НЕ зі списку brands нижче.
title_blocklist_unless_brand:
  brands:
    - Gucci
    - Louis Vuitton
  words:
    - cap
    - caps
    - kepka
    - czapka
    - czapki
    - kappe
    - muetze
    - mutze
    - snapback
    - trucker
    - casquette
    - cappello
    - gorra
    - beanie
    - bucket hat
    - hat
    - hats

