# Бренди для перекупа.
#
# Тіри розставлені НЕ за репутацією, а за виміряною медіаною цін на vinted.de
# у категорії верхнього одягу (96 лотів на бренд, заміряно скриптом
# scripts/calibrate.py та разовим прогоном по кожному бренду):
#   S - медіана від 130 євро
#   A - від 55 до 129
#   B - нижче 55, масовий обсяг і швидкий оборот
#
# Хайпові вуличні бренди навмисно прибрані. Trapstar, Corteiz, Supreme,
# Palace, BAPE, Off-White, Yeezy, Represent, Palm Angels, Amiri гучні в
# соцмережах, але на Vinted їх завалено: Trapstar має медіану 58 євро,
# Corteiz 60. Оцінювати їх як преміум означало показувати профіт, якого нема.
#
# replica_risk: high | medium | low
#   Лот не відсікається, лише йде з попередженням в алерті.

brands:
  # --- S: преміум з підтвердженою ціною ---
