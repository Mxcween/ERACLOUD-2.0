# Бренди для перекупа. ТІЛЬКИ ХОДОВІ - список заміряний, а не складений.
#
# Правило відбору: попит = (медіана вподобань на лот) x (частка лотів із 5+
# вподобаннями), поріг 5.0. Заміряно на вибірці до 96 живих лотів на бренд
# у семи наших категоріях, скриптом у scratchpad; цифри в коментарях біля
# кожного бренду - звідти.
#
# Чому саме вподобання: це єдиний сигнал попиту, який Vinted віддає прямо в
# стрічці. Ціна каже, скільки річ КОШТУЄ, а не чи її беруть - Mackage має
# медіану 230 євро і при цьому 3 вподобання на лот, тобто висить.
#
# Слабке місце методу назване чесно: вподобання накопичуються з часом, тому
# бренд, який розлітається за годину, теоретично може виглядати тихішим за
# той, що місяцями збирає лайки. На практиці рейтинг збігся з реальністю
# впритул (угорі Rick Owens, Supreme, Stussy, Margiela, TNF, Arc'teryx,
# Patagonia; унизу Erima, Macron, Joma, Castore), тож метод лишаємо.
#
# За цим порогом прибрано 57 брендів, серед них Dr. Martens (6 вподобань,
# 64%), Fila (6, 58%), Kappa (5, 59%), Tommy Hilfiger (5, 54%). Це не
# помилка вимірювання, це і є "не ходові": відомі, але лежать.
#
# Тіри розставлені НЕ за репутацією, а за виміряною медіаною цін на vinted.de
# у категорії верхнього одягу (96 лотів на бренд, заміряно скриптом
# scripts/calibrate.py та разовим прогоном по кожному бренду):
#   S - медіана від 130 євро
#   A - від 55 до 129
#   B - нижче 55, масовий обсяг і швидкий оборот
#
# Хайпові вуличні бренди навмисно прибрані. Trapstar, Corteiz, Supreme,
# Palace, BAPE, Off-White, Yeezy, Represent, Palm Angels, Amiri гучні в
# соцмережах, але на Vinted їх завалено: Trapstar має медіану 58 євро,
# Corteiz 60. Оцінювати їх як преміум означало показувати профіт, якого нема.
#
# replica_risk: high | medium | low
#   Лот не відсікається, лише йде з попередженням в алерті.

