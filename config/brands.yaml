  # стабільний попит, майже нема підробок бо підробляти нема сенсу.
  - {name: "Adidas Originals",    tier: B, replica_risk: medium}
  - {name: "Nike ACG",            tier: A, replica_risk: medium}

  # --- Розширення заради обсягу ---
  # Додано, коли стало ясно, що вузьке місце - не пороги, а асортимент: за
  # 45 хвилин фільтри на вході відкинули лише 4 лоти, тобто ріже вже не
  # фільтр, а те, що бот просто не дивиться на решту ринку. Vinted спокійно
  # приймає 200 брендів в одному запиті (перевірено), тож розширення нічого
  # не коштує в запитах - це та сама стрічка, лише ширша.
  #
  # Тіри тут проставлені за репутацією, а НЕ заміряні, на відміну від
  # списку вище. Це свідомий компроміс: поки по зв'язці бренд+категорія не
  # набереться 8 живих оголошень, оцінка йде з базової таблиці ще й із
  # надбавкою unmeasured_multiple_premium, тому помилка в тірі коштує
  # пропущеного лота, а не поганої покупки. Через добу-другу медіани
  # переважать здогадки. Перекалібрувати: python scripts/calibrate.py

