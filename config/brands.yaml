# Ліквідні бренди для перекупа. Id підтягуються автоматично з Vinted API
# (scripts/resolve_brands.py) і кешуються в config/brand_ids.json.
#
# tier:
#   S - хайп і преміум, найбільша маржа, але й найбільше реплік
#   A - стабільно добре продається, основний робочий тір
#   B - великий обсяг, швидкий оборот, маржа менша
#
# replica_risk: high | medium | low
#   Лот не відсікається, але в алерті буде попередження. Vinted окремо віддає
#   свій прапорець requires_authenticity_check, він теж враховується.
#
# min_multiple: індивідуальний поріг вигоди. Якщо не заданий, береться з config.yaml

