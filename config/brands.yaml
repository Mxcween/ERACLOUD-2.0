# Бренди для перекупа. ТІЛЬКИ ТІ, ЩО ЗНАЄ КОЖЕН.
#
# Список свідомо короткий. До цього тут було 76 брендів, відібраних за
# виміряним попитом, - і це був правильний відбір за неправильним питанням.
# Міряв він "чи розлітається бренд на Vinted", а власнику треба інше: "чи
# впізнаю я це, не гуглячи". Половина списку не проходила саме цю перевірку
# (Klattermusen, Haglofs, Rab, Edwin, Nudie Jeans, Palladium, Lonsdale), і
# алерти по них виглядали як шум, хай би якими ліквідними вони були.
#
# Правило тепер одне: бренд лишається, якщо його назве будь-яка людина з
# вулиці. Carhartt, Timberland і Napapijri прибрані на пряме прохання - вони
# саме з тих, що "відомі тим, хто в темі", а не всім.
#
# Що це коштує, названо чесно: обсяг. Заміряно на живій стрічці футболок
# (95 лотів наших брендів, PL): на ці 22 бренди припало 70 лотів із 95,
# тобто близько трьох чвертей. Решта чверть - довгий хвіст, який і давав
# незнайомі назви. Алерти стануть приблизно на чверть рідшими.
#
# Прибрані, хоч і ліквідні за замірами:
#   Stussy (22€, вподобань 30, гарячих 95% - другий найгарячіший у списку)
#   Thrasher, A Bathing Ape, Palace, Arc'teryx, Patagonia, Carhartt WIP
# Прибраний люкс (Gucci, Louis Vuitton, Prada, Versace, Balenciaga,
# Burberry, Saint Laurent, Margiela, Rick Owens, Bottega): за цінами Vinted
# це переважно репліки, тобто рівно той мотлох, через який список і різали.
# Разом з Gucci та LV втратив сенс виняток на кепки в
# title_blocklist_unless_brand - кепки тепер відсікаються завжди.
#
# Тіри лишились ті самі й означають те саме - планку множника:
#   S - преміум з підтвердженою ціною
#   A - робочий тір
#   B - масовий обсяг і швидкий оборот
#
# replica_risk: high | medium | low
#   Лот не відсікається, лише йде з попередженням в алерті.
#
# Цифри в коментарях - з того самого заміру попиту:
#   медіана ціни € · медіана вподобань на лот · частка лотів із 5+ вподобаннями

