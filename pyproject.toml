[project]
name = "vintsniper"
version = "0.1.0"
description = "Vinted monitor for liquid resale brands with Telegram alerts"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.27.2",
    "PyYAML==6.0.2",
    "SQLAlchemy==2.0.36",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.3"]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
